    <!-- ── Structured Data: SoftwareApplication ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PaintFlow AI",
      "url": "https://paintflowai.com",
      "description": "Upload any photo and get a complete, narrated oil painting tutorial in seconds. Step-by-step AI guide with color mixing, layer-by-layer technique, and voice narration.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript",
      "offers": [
        {
          "@type": "Offer",
          "name": "One Tutorial",
          "price": "2.99",
          "priceCurrency": "USD",
          "description": "One AI-generated oil painting tutorial with full 10-step classical technique and voice narration."
        },
        {
          "@type": "Offer",
          "name": "Unlimited Subscription",
          "price": "9.99",
          "priceCurrency": "USD",
          "description": "Unlimited AI oil painting tutorials every month. All skill levels, full voice narration, cancel anytime."
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "PaintFlow AI",
        "url": "https://paintflowai.com",
        "email": "support@paintflowai.com"
      },
      "featureList": [
        "AI-generated oil painting tutorials",
        "Voice-narrated step-by-step guide",
        "Color mixing instructions",
        "Layer-by-layer classical technique",
        "Beginner to advanced skill levels"
      ]
    }
    </script>

    <!-- ── Structured Data: FAQPage (helps with Google rich snippets) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does PaintFlow AI work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Upload any reference photo — landscapes, portraits, still life — and our AI generates a complete narrated oil painting tutorial tailored to your image. Each tutorial includes color mixing, layer-by-layer instructions, and voice narration."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need painting experience to use PaintFlow AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. PaintFlow AI supports beginner, intermediate, and advanced skill levels. The beginner tutorial uses simple language and a limited 3-color palette so anyone can start painting right away."
          }
        },
        {
          "@type": "Question",
          "name": "How much does PaintFlow AI cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can get one full oil painting tutorial for $2.99 as a one-time purchase. For unlimited tutorials every month, the subscription plan is $9.99/month and can be cancelled anytime."
          }
        },
        {
          "@type": "Question",
          "name": "What painting medium does PaintFlow AI support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PaintFlow AI is specialized for oil painting, using classical Old Master technique including imprimatura, grisaille, glazing, scumbling, and impasto."
          }
        }
      ]
    }
    </script>
